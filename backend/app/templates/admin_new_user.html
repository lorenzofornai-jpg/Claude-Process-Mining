{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>{{ _("Nuovo utente") }}</h1>
  <p class="muted">
    {{ _("Crea un utente a cui potrai poi assegnare uno o più processi (Data Engineer/Data Analyst), oppure un altro amministratore con i tuoi stessi privilegi.") }}
  </p>
  {% if error %}
  <div class="banner warning">{{ error|tr }}</div>
  {% endif %}
  <form method="post" action="/admin/users/new" class="form">
    <label>{{ _("Nome") }}
      <input type="text" name="name" placeholder="{{ _("es. Carlos Alcaraz") }}" required>
    </label>
    <label>Email
      <input type="email" name="email" required>
    </label>
    <label>{{ _("Password iniziale") }}
      <input type="password" name="password" required minlength="8">
    </label>
    <label class="checkbox">
      <input type="checkbox" name="is_admin" value="1">
      {{ _("Crea come amministratore (gestisce utenti, processi e assegnazioni, come te)") }}
    </label>
    <button type="submit" class="primary">{{ _("Crea utente") }}</button>
  </form>
</div>
{% endblock %}
