{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Nuovo utente</h1>
  <p class="muted">
    Crea un utente a cui potrai poi assegnare uno o più processi (Data Engineer/Data Analyst), oppure
    un altro amministratore con i tuoi stessi privilegi.
  </p>
  {% if error %}
  <div class="banner warning">{{ error }}</div>
  {% endif %}
  <form method="post" action="/admin/users/new" class="form">
    <label>Nome
      <input type="text" name="name" placeholder="es. Carlos Alcaraz" required>
    </label>
    <label>Email
      <input type="email" name="email" required>
    </label>
    <label>Password iniziale
      <input type="password" name="password" required minlength="8">
    </label>
    <label class="checkbox">
      <input type="checkbox" name="is_admin" value="1">
      Crea come amministratore (gestisce utenti, processi e assegnazioni, come te)
    </label>
    <button type="submit" class="primary">Crea utente</button>
  </form>
</div>
{% endblock %}
