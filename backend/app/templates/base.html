<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}AI Process Mining - Ingestion{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">AI Process Mining <span>Modulo 1 · Ingestion</span></div>
    <div class="steps">
      <span class="step {{ 'active' if step == 1 else '' }}">1. Contesto</span>
      <span class="step {{ 'active' if step == 2 else '' }}">2. Dati sorgente</span>
      <span class="step {{ 'active' if step == 3 else '' }}">3. Revisione mapping</span>
      <span class="step {{ 'active' if step == 4 else '' }}">4. Risultato</span>
    </div>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
