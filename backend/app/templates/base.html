<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}AI Process Mining{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v={{ static_version }}">
</head>
<body>
  <header class="app-header">
    <div class="brand">AI Process Mining</div>
    {% if step %}
    <div class="steps">
      <span class="step {{ 'active' if step == 2 else '' }}">1. Dati sorgente</span>
      <span class="step {{ 'active' if step == 3 else '' }}">2. Revisione mapping</span>
      <span class="step {{ 'active' if step == 4 else '' }}">3. Risultato</span>
    </div>
    {% endif %}
    {% if user %}
    <div class="user-box">
      {% if user.is_admin %}
      <a href="/admin" class="nav-link">Amministrazione</a>
      {% else %}
      <a href="/ingestion/dashboard" class="nav-link">I miei processi</a>
      {% endif %}
      <span class="user-name">{{ user.name }}{{ ' (admin)' if user.is_admin else '' }}</span>
      <form method="post" action="/logout" style="display:inline">
        <button type="submit" class="link-button">Esci</button>
      </form>
    </div>
    {% endif %}
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
